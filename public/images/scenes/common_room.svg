    <rect x="102" y="350" width="33" height="25" fill="#1a2a4a" opacity="0.8"/>
    <rect x="140" y="350" width="28" height="25" fill="#3a5a8a" opacity="0.8"/>
    <rect x="173" y="350" width="35" height="25" fill="#1a4a6a" opacity="0.8"/>
