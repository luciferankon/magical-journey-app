    <line x1="20" y1="380" x2="400" y2="380" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>
    <line x1="20" y1="480" x2="400" y2="480" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>
    <line x1="20" y1="580" x2="400" y2="580" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>
    <line x1="20" y1="680" x2="400" y2="680" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>

