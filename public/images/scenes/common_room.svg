<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ff4500;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#cc3300;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#661a00;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="70%">
      <stop offset="0%" style="stop-color:#ffaa44;stop-opacity:0.95" />
      <stop offset="40%" style="stop-color:#dd6633;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1a0f08;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="moonGlow3" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#4dd0e1;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#0d8fa3;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#001a1f;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a0f08;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f08;stop-opacity:1" />
    </linearGradient>
    <filter id="fireFlicker">
      <feGaussianBlur in="SourceGraphic" stdDeviation="25" />
    </filter>
    <filter id="bookBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>
  </defs>

  <!-- Background - warm wood paneling -->
  <rect width="1920" height="1080" fill="url(#panelGrad)"/>

