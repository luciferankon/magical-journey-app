    <rect x="101" y="450" width="30" height="25" fill="#6a1a1a" opacity="0.8"/>
    <rect x="136" y="450" width="32" height="25" fill="#8a3a3a" opacity="0.8"/>
    <rect x="173" y="450" width="28" height="25" fill="#5a2a1a" opacity="0.8"/>
    <rect x="206" y="450" width="35" height="25" fill="#9a4a2a" opacity="0.8"/>
    <rect x="246" y="450" width="30" height="25" fill="#6a3a1a" opacity="0.8"/>
    <rect x="281" y="450" width="33" height="25" fill="#7a4a2a" opacity="0.8"/>
    <rect x="319" y="450" width="28" height="25" fill="#5a2a2a" opacity="0.8"/>
    <rect x="352" y="450" width="32" height="25" fill="#8a3a1a" opacity="0.8"/>

    <!-- Fourth shelf -->
    <rect x="30" y="550" width="35" height="25" fill="#4a5a3a" opacity="0.8"/>
    <rect x="70" y="550" width="28" height="25" fill="#5a6a4a" opacity="0.8"/>
    <rect x="103" y="550" width="32" height="25" fill="#3a4a2a" opacity="0.8"/>
    <rect x="140" y="550" width="30" height="25" fill="#6a7a5a" opacity="0.8"/>
