  <!-- Fireplace - center/right -->
  <g opacity="0.95">
    <!-- Fireplace opening -->
    <rect x="1150" y="400" width="550" height="550" fill="#0a0603" opacity="0.95" rx="15"/>

    <!-- Fire logs - dark silhouettes -->
    <ellipse cx="1300" cy="800" rx="100" ry="40" fill="#1a0f08" opacity="0.9"/>
    <ellipse cx="1450" cy="810" rx="90" ry="35" fill="#1a0f08" opacity="0.9"/>
    <ellipse cx="1580" cy="805" rx="85" ry="38" fill="#1a0f08" opacity="0.9"/>

    <!-- Flames - gradient fill -->
    <polygon points="1250,750 1220,550 1280,600 1250,450" fill="url(#fireGrad)" opacity="0.95"/>
    <polygon points="1380,780 1340,500 1420,620 1400,420" fill="url(#fireGrad)" opacity="0.95"/>
    <polygon points="1520,760 1480,520 1560,640 1540,450" fill="url(#fireGrad)" opacity="0.95"/>
    <polygon points="1650,770 1610,540 1690,660 1670,460" fill="url(#fireGrad)" opacity="0.95"/>

    <!-- Fireplace stone frame -->
    <rect x="1150" y="400" width="550" height="550" fill="none" stroke="#2a2520" stroke-width="25" opacity="0.7" rx="15"/>
  </g>

  <!-- Fire glow illuminating the room -->
  <ellipse cx="1350" cy="700" rx="600" ry="500" fill="url(#fireGlow)" opacity="0.5" filter="url(#fireFlicker)"/>

  <!-- Window on left - moonlight -->
  <rect x="420" y="180" width="280" height="380" fill="#001a2a" opacity="0.95" rx="10"/>
  <circle cx="560" cy="370" r="140" fill="#4dd0e1" opacity="0.4"/>

  <!-- Window frame panes -->
  <line x1="560" y1="180" x2="560" y2="560" stroke="#1a1a25" stroke-width="3" opacity="0.8"/>
  <line x1="420" y1="370" x2="700" y2="370" stroke="#1a1a25" stroke-width="3" opacity="0.8"/>

  <!-- Outside moonlit courtyard view (cold blue) -->
  <polygon points="420,180 700,180 700,560 420,560" fill="#0d1a2a" opacity="0.5"/>

  <!-- Armchairs near fire - silhouettes -->
  <g opacity="0.75">
    <!-- Chair 1 -->
    <ellipse cx="950" cy="750" rx="70" ry="90" fill="#1a0f08" opacity="0.95"/>
    <rect x="900" y="830" width="100" height="50" fill="#1a0f08" opacity="0.9" rx="5"/>

    <!-- Chair 2 -->
    <ellipse cx="1100" cy="750" rx="70" ry="90" fill="#1a0f08" opacity="0.95"/>
    <rect x="1050" y="830" width="100" height="50" fill="#1a0f08" opacity="0.9" rx="5"/>
  </g>

  <!-- Side tables -->
  <rect x="880" y="800" width="60" height="80" fill="#2a1810" opacity="0.8" rx="3"/>
  <rect x="1130" y="800" width="60" height="80" fill="#2a1810" opacity="0.8" rx="3"/>

  <!-- Ceiling beams visible in darkness above -->
  <line x1="0" y1="150" x2="1920" y2="150" stroke="#1a0f08" stroke-width="35" opacity="0.6"/>
  <line x1="0" y1="220" x2="1920" y2="220" stroke="#1a0f08" stroke-width="28" opacity="0.5"/>

  <!-- Deep burgundy carpet on floor -->
  <rect x="300" y="880" width="1320" height="200" fill="#5a1a2a" opacity="0.75"/>
  <rect x="350" y="900" width="1220" height="160" fill="#6a2a3a" opacity="0.6"/>

  <!-- Carpet pattern (subtle) -->
  <circle cx="450" cy="950" r="20" fill="#4a1a2a" opacity="0.4"/>
  <circle cx="750" cy="980" r="18" fill="#4a1a2a" opacity="0.4"/>
  <circle cx="1050" cy="940" r="20" fill="#4a1a2a" opacity="0.4"/>
  <circle cx="1350" cy="970" r="18" fill="#4a1a2a" opacity="0.4"/>
  <circle cx="1650" cy="945" r="20" fill="#4a1a2a" opacity="0.4"/>
</svg>
