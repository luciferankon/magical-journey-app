    <rect x="248" y="350" width="32" height="25" fill="#3a6a9a" opacity="0.8"/>
    <rect x="285" y="350" width="28" height="25" fill="#1a3a5a" opacity="0.8"/>
    <rect x="318" y="350" width="33" height="25" fill="#2a5a7a" opacity="0.8"/>
    <rect x="356" y="350" width="30" height="25" fill="#1a4a5a" opacity="0.8"/>

