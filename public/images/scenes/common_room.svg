    <rect x="65" y="250" width="35" height="25" fill="#5c3a1a" opacity="0.8"/>
    <rect x="105" y="250" width="28" height="25" fill="#a0522d" opacity="0.8"/>
    <rect x="138" y="250" width="32" height="25" fill="#6b4423" opacity="0.8"/>
    <rect x="175" y="250" width="30" height="25" fill="#8b6f47" opacity="0.8"/>
    <rect x="210" y="250" width="35" height="25" fill="#4a2511" opacity="0.8"/>
