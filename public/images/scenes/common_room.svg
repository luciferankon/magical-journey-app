    <rect x="1565" y="250" width="35" height="25" fill="#5c3a1a" opacity="0.8"/>
    <rect x="1605" y="250" width="28" height="25" fill="#a0522d" opacity="0.8"/>
    <rect x="1638" y="250" width="32" height="25" fill="#6b4423" opacity="0.8"/>
    <rect x="1675" y="250" width="30" height="25" fill="#8b6f47" opacity="0.8"/>
    <rect x="1710" y="250" width="35" height="25" fill="#4a2511" opacity="0.8"/>
