    <rect x="1567" y="350" width="30" height="25" fill="#2a4a7a" opacity="0.8"/>
    <rect x="1602" y="350" width="33" height="25" fill="#1a2a4a" opacity="0.8"/>
    <rect x="1640" y="350" width="28" height="25" fill="#3a5a8a" opacity="0.8"/>
    <rect x="1673" y="350" width="35" height="25" fill="#1a4a6a" opacity="0.8"/>
    <rect x="1713" y="350" width="30" height="25" fill="#2a3a5a" opacity="0.8"/>
    <rect x="1748" y="350" width="32" height="25" fill="#3a6a9a" opacity="0.8"/>
    <rect x="1785" y="350" width="28" height="25" fill="#1a3a5a" opacity="0.8"/>
    <rect x="1818" y="350" width="33" height="25" fill="#2a5a7a" opacity="0.8"/>
    <rect x="1856" y="350" width="30" height="25" fill="#1a4a5a" opacity="0.8"/>

    <!-- Third and subsequent shelves (abbreviated for space) -->
