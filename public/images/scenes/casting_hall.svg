<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="lightShaftGrad" x1="50%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd966;stop-opacity:0.8" />
      <stop offset="30%" style="stop-color:#cc9944;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#8b6a47;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="lightShaftGrad2" x1="50%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#ffdd88;stop-opacity:0.75" />
      <stop offset="35%" style="stop-color:#ccaa55;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#8b6a47;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="lightShaftGrad3" x1="50%" y1="0%" x2="25%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc77;stop-opacity:0.7" />
      <stop offset="40%" style="stop-color:#bb8844;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#8b6a47;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="scorchGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ff8800;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#aa4400;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#1a1520;stop-opacity:0" />
    </radialGradient>
    <filter id="dustMote">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>
    <filter id="lightBloom">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" />
    </filter>
  </defs>

  <!-- Dark stone walls and floor -->
  <rect width="1920" height="1080" fill="#1a1a25"/>

  <!-- Upper stone walls (clerestory level) -->
  <rect x="0" y="0" width="1920" height="200" fill="#0f0f15" opacity="0.9"/>

  <!-- Clerestory windows (high on walls) - light sources -->
  <!-- Window 1 - left -->
  <rect x="150" y="20" width="280" height="140" fill="#2a2a35" opacity="0.95" rx="8"/>
  <line x1="290" y1="20" x2="290" y2="160" stroke="#1a1a20" stroke-width="4" opacity="0.8"/>
  <line x1="150" y1="90" x2="430" y2="90" stroke="#1a1a20" stroke-width="3" opacity="0.7"/>

  <!-- Window 2 - center-left -->
  <rect x="550" y="20" width="280" height="140" fill="#2a2a35" opacity="0.95" rx="8"/>
  <line x1="690" y1="20" x2="690" y2="160" stroke="#1a1a20" stroke-width="4" opacity="0.8"/>
  <line x1="550" y1="90" x2="830" y2="90" stroke="#1a1a20" stroke-width="3" opacity="0.7"/>

  <!-- Window 3 - center-right -->
  <rect x="950" y="20" width="280" height="140" fill="#2a2a35" opacity="0.95" rx="8"/>
  <line x1="1090" y1="20" x2="1090" y2="160" stroke="#1a1a20" stroke-width="4" opacity="0.8"/>
  <line x1="950" y1="90" x2="1230" y2="90" stroke="#1a1a20" stroke-width="3" opacity="0.7"/>

  <!-- Window 4 - right -->
  <rect x="1350" y="20" width="280" height="140" fill="#2a2a35" opacity="0.95" rx="8"/>
  <line x1="1490" y1="20" x2="1490" y2="160" stroke="#1a1a20" stroke-width="4" opacity="0.8"/>
  <line x1="1350" y1="90" x2="1630" y2="90" stroke="#1a1a20" stroke-width="3" opacity="0.7"/>

  <!-- Visible window light glows from inside panes -->
  <rect x="150" y="20" width="280" height="140" fill="#ffdd88" opacity="0.2" rx="8"/>
  <rect x="550" y="20" width="280" height="140" fill="#ffdd88" opacity="0.2" rx="8"/>
  <rect x="950" y="20" width="280" height="140" fill="#ffdd88" opacity="0.2" rx="8"/>
  <rect x="1350" y="20" width="280" height="140" fill="#ffdd88" opacity="0.2" rx="8"/>

  <!-- Light shaft 1 from left window -->
  <polygon points="290,160 150,900 450,1080 550,300" fill="url(#lightShaftGrad)" opacity="0.6"/>

  <!-- Light shaft 2 from center-left window -->
  <polygon points="690,160 450,900 900,1080 950,300" fill="url(#lightShaftGrad2)" opacity="0.55"/>

  <!-- Light shaft 3 from center-right window -->
  <polygon points="1090,160 900,1080 1350,900 1200,300" fill="url(#lightShaftGrad3)" opacity="0.6"/>

  <!-- Light shaft 4 from right window -->
  <polygon points="1490,160 1200,300 1700,900 1770,1080" fill="url(#lightShaftGrad)" opacity="0.55"/>

  <!-- Dust motes in light shafts (tiny pale dots) -->
  <!-- In shaft 1 -->
  <circle cx="280" cy="250" r="1" fill="#e8dcc8" opacity="0.6" filter="url(#dustMote)"/>
  <circle cx="300" cy="400" r="0.8" fill="#e8dcc8" opacity="0.5" filter="url(#dustMote)"/>
  <circle cx="270" cy="550" r="0.9" fill="#e8dcc8" opacity="0.55" filter="url(#dustMote)"/>
  <circle cx="310" cy="700" r="0.7" fill="#e8dcc8" opacity="0.45" filter="url(#dustMote)"/>
  <circle cx="250" cy="850" r="0.8" fill="#e8dcc8" opacity="0.5" filter="url(#dustMote)"/>
  <circle cx="320" cy="950" r="0.9" fill="#e8dcc8" opacity="0.55" filter="url(#dustMote)"/>

  <!-- In shaft 2 -->
  <circle cx="620" cy="300" r="1" fill="#e8dcc8" opacity="0.6" filter="url(#dustMote)"/>
  <circle cx="680" cy="450" r="0.8" fill="#e8dcc8" opacity="0.5" filter="url(#dustMote)"/>
  <circle cx="660" cy="600" r="0.9" fill="#e8dcc8" opacity="0.55" filter="url(#dustMote)"/>
  <circle cx="710" cy="750" r="0.7" fill="#e8dcc8" opacity="0.45" filter="url(#dustMote)"/>
  <circle cx="650" cy="900" r="0.8" fill="#e8dcc8" opacity="0.5" filter="url(#dustMote)"/>
  <circle cx="720" cy="1000" r="0.9" fill="#e8dcc8" opacity="0.55" filter="url(#dustMote)"/>

  <!-- In shaft 3 -->
  <circle cx="1020" cy="350" r="1" fill="#e8dcc8" opacity="0.6" filter="url(#dustMote)"/>
  <circle cx="1080" cy="500" r="0.8" fill="#e8dcc8" opacity="0.5" filter="url(#dustMote)"/>
  <circle cx="1060" cy="650" r="0.9" fill="#e8dcc8" opacity="0.55" filter="url(#dustMote)"/>
  <circle cx="1100" cy="800" r="0.7" fill="#e8dcc8" opacity="0.45" filter="url(#dustMote)"/>
  <circle cx="1050" cy="950" r="0.8" fill="#e8dcc8" opacity="0.5" filter="url(#dustMote)"/>

  <!-- In shaft 4 -->
  <circle cx="1420" cy="300" r="1" fill="#e8dcc8" opacity="0.6" filter="url(#dustMote)"/>
  <circle cx="1480" cy="450" r="0.8" fill="#e8dcc8" opacity="0.5" filter="url(#dustMote)"/>
  <circle cx="1460" cy="600" r="0.9" fill="#e8dcc8" opacity="0.55" filter="url(#dustMote)"/>
  <circle cx="1520" cy="750" r="0.7" fill="#e8dcc8" opacity="0.45" filter="url(#dustMote)"/>
  <circle cx="1450" cy="900" r="0.8" fill="#e8dcc8" opacity="0.5" filter="url(#dustMote)"/>
  <circle cx="1520" cy="1000" r="0.9" fill="#e8dcc8" opacity="0.55" filter="url(#dustMote)"/>

  <!-- Scorch marks on stone floor (dark circles with orange glow edges) -->
  <!-- Large scorch 1 - center left -->
  <circle cx="350" cy="850" r="110" fill="#0a0805" opacity="0.95"/>
  <circle cx="350" cy="850" r="110" fill="url(#scorchGlow)" opacity="0.4"/>

  <!-- Large scorch 2 - center right -->
  <circle cx="1450" cy="800" r="120" fill="#0a0805" opacity="0.95"/>
  <circle cx="1450" cy="800" r="120" fill="url(#scorchGlow)" opacity="0.4"/>

  <!-- Medium scorch 3 - left side -->
  <circle cx="200" cy="950" r="80" fill="#0a0805" opacity="0.9"/>
  <circle cx="200" cy="950" r="80" fill="url(#scorchGlow)" opacity="0.35"/>

  <!-- Medium scorch 4 - center -->
  <circle cx="950" cy="900" r="90" fill="#0a0805" opacity="0.9"/>
  <circle cx="950" cy="900" r="90" fill="url(#scorchGlow)" opacity="0.35"/>

  <!-- Small scorch 5 - right side -->
  <circle cx="1700" cy="950" r="70" fill="#0a0805" opacity="0.85"/>
  <circle cx="1700" cy="950" r="70" fill="url(#scorchGlow)" opacity="0.3"/>

  <!-- Stone floor with chalk circle markings visible in light -->
  <circle cx="950" cy="800" r="250" fill="none" stroke="#ccaa77" stroke-width="3" opacity="0.4"/>
  <circle cx="950" cy="800" r="200" fill="none" stroke="#ccaa77" stroke-width="2" opacity="0.3"/>

  <!-- Chalk cross in circle -->
  <line x1="700" y1="800" x2="1200" y2="800" stroke="#ccaa77" stroke-width="2" opacity="0.35"/>
  <line x1="950" y1="550" x2="950" y2="1050" stroke="#ccaa77" stroke-width="2" opacity="0.35"/>

  <!-- Radial chalk lines from center -->
  <line x1="950" y1="800" x2="1100" y2="600" stroke="#ccaa77" stroke-width="1.5" opacity="0.25"/>
  <line x1="950" y1="800" x2="1150" y2="750" stroke="#ccaa77" stroke-width="1.5" opacity="0.25"/>
  <line x1="950" y1="800" x2="1100" y2="950" stroke="#ccaa77" stroke-width="1.5" opacity="0.25"/>
  <line x1="950" y1="800" x2="800" y2="950" stroke="#ccaa77" stroke-width="1.5" opacity="0.25"/>
  <line x1="950" y1="800" x2="750" y2="750" stroke="#ccaa77" stroke-width="1.5" opacity="0.25"/>
  <line x1="950" y1="800" x2="800" y2="600" stroke="#ccaa77" stroke-width="1.5" opacity="0.25"/>

  <!-- Instructor's raised platform at far end -->
  <g opacity="0.8">
    <!-- Platform stairs -->
    <polygon points="700,900 1200,900 1180,880 720,880" fill="#2a2a35" opacity="0.85"/>
    <polygon points="700,880 1200,880 1180,850 720,850" fill="#1a1a25" opacity="0.8"/>
    <polygon points="700,850 1200,850 1180,820 720,820" fill="#0f0f15" opacity="0.75"/>

    <!-- Raised stage -->
    <rect x="720" y="750" width="480" height="70" fill="#2a2a35" opacity="0.9" rx="5"/>

    <!-- Lectern - dark wood structure -->
    <rect x="900" y="650" width="120" height="100" fill="#1a1008" opacity="0.95" rx="3"/>
    <polygon points="900,650 1020,650 1030,630 890,630" fill="#2a1810" opacity="0.8"/>
  </g>

  <!-- Faint glow on platform from light shafts -->
  <ellipse cx="950" cy="800" rx="350" ry="150" fill="#ffdd88" opacity="0.15"/>
</svg>
