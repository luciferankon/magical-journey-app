<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="librarySky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0508;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1a1018;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2018;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="windowGlow4" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffdd88;stop-opacity:0.85" />
      <stop offset="50%" style="stop-color:#cc8844;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0a0508;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="bookGlow1" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#4dd0e1;stop-opacity:0.9" />
      <stop offset="60%" style="stop-color:#1a7f8c;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0a0508;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="bookGlow2" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#7dd3c0;stop-opacity:0.85" />
      <stop offset="60%" style="stop-color:#3a8b7a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0a0508;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="bookGlow3" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#bb88ff;stop-opacity:0.8" />
      <stop offset="60%" style="stop-color:#5a4a9a;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#0a0508;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="bookGlow4" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#ffcc77;stop-opacity:0.82" />
      <stop offset="60%" style="stop-color:#8a7a4a;stop-opacity:0.28" />
      <stop offset="100%" style="stop-color:#0a0508;stop-opacity:0" />
    </radialGradient>
    <filter id="bookBloom">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
    </filter>
  </defs>

  <!-- Background - towering darkness -->
  <rect width="1920" height="1080" fill="url(#librarySky)"/>

  <!-- Bookshelves left side - floor to ceiling 3 levels -->
  <g opacity="0.9">
    <!-- Level 1 shelves (bottom) -->
    <rect x="20" y="700" width="380" height="380" fill="#0f0805" opacity="0.95" rx="2"/>
    <line x1="20" y1="770" x2="400" y2="770" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>
    <line x1="20" y1="840" x2="400" y2="840" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>
    <line x1="20" y1="910" x2="400" y2="910" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>
    <line x1="20" y1="980" x2="400" y2="980" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>

    <!-- Level 2 shelves (middle) -->
    <rect x="20" y="400" width="380" height="280" fill="#0f0805" opacity="0.95" rx="2"/>
    <line x1="20" y1="480" x2="400" y2="480" stroke="#1a0f08" stroke-width="2.5" opacity="0.5"/>
    <line x1="20" y1="550" x2="400" y2="550" stroke="#1a0f08" stroke-width="2.5" opacity="0.5"/>
    <line x1="20" y1="620" x2="400" y2="620" stroke="#1a0f08" stroke-width="2.5" opacity="0.5"/>

    <!-- Level 3 shelves (upper, fading) -->
    <rect x="20" y="100" width="380" height="280" fill="#0f0805" opacity="0.8" rx="2"/>
    <line x1="20" y1="180" x2="400" y2="180" stroke="#1a0f08" stroke-width="2.5" opacity="0.4"/>
    <line x1="20" y1="250" x2="400" y2="250" stroke="#1a0f08" stroke-width="2.5" opacity="0.4"/>
  </g>

  <!-- Left side books - dense rows -->
  <g opacity="0.85">
    <!-- Level 1 books -->
    <rect x="30" y="730" width="15" height="35" fill="#8b4513" opacity="0.9"/>
    <rect x="48" y="725" width="18" height="40" fill="#5c3a1a" opacity="0.9"/>
    <rect x="70" y="728" width="16" height="37" fill="#a0522d" opacity="0.9"/>
    <rect x="90" y="722" width="19" height="43" fill="#6b4423" opacity="0.9"/>
    <rect x="113" y="730" width="15" height="35" fill="#8b6f47" opacity="0.9"/>
    <rect x="132" y="726" width="17" height="39" fill="#4a2511" opacity="0.9"/>
    <rect x="153" y="728" width="16" height="37" fill="#7a5a3a" opacity="0.9"/>
    <rect x="173" y="724" width="18" height="41" fill="#9a6a4a" opacity="0.9"/>
    <rect x="195" y="730" width="15" height="35" fill="#5a3a1a" opacity="0.9"/>
    <rect x="214" y="727" width="17" height="38" fill="#8a5a2a" opacity="0.9"/>

    <!-- And more books continuing across -->
    <rect x="235" y="732" width="14" height="33" fill="#9a6a3a" opacity="0.85"/>
    <rect x="253" y="728" width="16" height="37" fill="#6a4a2a" opacity="0.85"/>
    <rect x="273" y="730" width="15" height="35" fill="#8a5a3a" opacity="0.85"/>
    <rect x="292" y="725" width="18" height="40" fill="#7a4a2a" opacity="0.85"/>
    <rect x="314" y="729" width="16" height="36" fill="#9a6a4a" opacity="0.85"/>
    <rect x="334" y="726" width="17" height="39" fill="#5a3a2a" opacity="0.85"/>
    <rect x="355" y="731" width="14" height="34" fill="#8a5a2a" opacity="0.85"/>
    <rect x="373" y="728" width="16" height="37" fill="#6a5a3a" opacity="0.85"/>

    <!-- Level 2 books (upper) -->
    <rect x="30" y="440" width="18" height="35" fill="#1a3a5a" opacity="0.9"/>
    <rect x="52" y="435" width="20" height="40" fill="#2a4a7a" opacity="0.9"/>
    <rect x="76" y="438" width="17" height="37" fill="#1a2a4a" opacity="0.9"/>
    <rect x="97" y="432" width="21" height="43" fill="#3a5a8a" opacity="0.9"/>
    <rect x="122" y="440" width="18" height="35" fill="#1a4a6a" opacity="0.9"/>

    <!-- Level 3 books (highest) -->
    <rect x="30" y="140" width="16" height="30" fill="#5a1a1a" opacity="0.8"/>
    <rect x="50" y="135" width="18" height="35" fill="#7a2a2a" opacity="0.8"/>
    <rect x="72" y="138" width="15" height="32" fill="#6a1a1a" opacity="0.8"/>
    <rect x="91" y="132" width="19" height="38" fill="#8a3a3a" opacity="0.8"/>
  </g>

  <!-- Bookshelves right side - mirrored -->
  <g opacity="0.9">
    <!-- Level 1 shelves (bottom) -->
    <rect x="1520" y="700" width="380" height="380" fill="#0f0805" opacity="0.95" rx="2"/>
    <line x1="1520" y1="770" x2="1900" y2="770" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>
    <line x1="1520" y1="840" x2="1900" y2="840" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>
    <line x1="1520" y1="910" x2="1900" y2="910" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>
    <line x1="1520" y1="980" x2="1900" y2="980" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>

    <!-- Level 2 shelves (middle) -->
    <rect x="1520" y="400" width="380" height="280" fill="#0f0805" opacity="0.95" rx="2"/>
    <line x1="1520" y1="480" x2="1900" y2="480" stroke="#1a0f08" stroke-width="2.5" opacity="0.5"/>
    <line x1="1520" y1="550" x2="1900" y2="550" stroke="#1a0f08" stroke-width="2.5" opacity="0.5"/>
    <line x1="1520" y1="620" x2="1900" y2="620" stroke="#1a0f08" stroke-width="2.5" opacity="0.5"/>

    <!-- Level 3 shelves (upper, fading) -->
    <rect x="1520" y="100" width="380" height="280" fill="#0f0805" opacity="0.8" rx="2"/>
    <line x1="1520" y1="180" x2="1900" y2="180" stroke="#1a0f08" stroke-width="2.5" opacity="0.4"/>
    <line x1="1520" y1="250" x2="1900" y2="250" stroke="#1a0f08" stroke-width="2.5" opacity="0.4"/>
  </g>

  <!-- Right side books -->
  <g opacity="0.85">
    <!-- (Mirrored from left) -->
    <rect x="1530" y="730" width="15" height="35" fill="#8b4513" opacity="0.9"/>
    <rect x="1548" y="725" width="18" height="40" fill="#5c3a1a" opacity="0.9"/>
    <rect x="1570" y="728" width="16" height="37" fill="#a0522d" opacity="0.9"/>
  </g>

  <!-- Circular rose window at far end (center back) -->
  <g opacity="0.85">
    <!-- Window frame circle -->
    <circle cx="960" cy="250" r="180" fill="#1a1018" opacity="0.95" stroke="#2a1a1a" stroke-width="8"/>

    <!-- Rose window design - stylized star/compass -->
    <!-- Outer ring -->
    <circle cx="960" cy="250" r="170" fill="none" stroke="#ffdd88" stroke-width="2" opacity="0.5"/>

    <!-- Inner divisions -->
    <line x1="960" y1="80" x2="960" y2="420" stroke="#ffdd88" stroke-width="1.5" opacity="0.4"/>
    <line x1="790" y1="250" x2="1130" y2="250" stroke="#ffdd88" stroke-width="1.5" opacity="0.4"/>
    <line x1="830" y1="110" x2="1090" y2="390" stroke="#ffdd88" stroke-width="1.5" opacity="0.35"/>
    <line x1="1090" y1="110" x2="830" y2="390" stroke="#ffdd88" stroke-width="1.5" opacity="0.35"/>

    <!-- Petals (star points) -->
    <circle cx="960" cy="100" r="25" fill="#ffdd88" opacity="0.35"/>
    <circle cx="960" cy="400" r="25" fill="#ffdd88" opacity="0.35"/>
    <circle cx="1100" cy="250" r="25" fill="#ffdd88" opacity="0.35"/>
    <circle cx="820" cy="250" r="25" fill="#ffdd88" opacity="0.35"/>

    <!-- Center -->
    <circle cx="960" cy="250" r="30" fill="#ffcc77" opacity="0.5"/>
    <circle cx="960" cy="250" r="20" fill="#ffdd88" opacity="0.6"/>
  </g>

  <!-- Window glow halo -->
  <ellipse cx="960" cy="250" rx="220" ry="220" fill="url(#windowGlow4)" opacity="0.5"/>

  <!-- Reading tables with candelabras -->
  <!-- Table 1 -->
  <g opacity="0.75">
    <rect x="200" y="850" width="280" height="60" fill="#0f0805" opacity="0.9" rx="4"/>
    <!-- Candelabra -->
    <circle cx="280" cy="820" r="8" fill="#2a2520" opacity="0.95"/>
    <circle cx="280" cy="820" r="5" fill="#ffcc77" opacity="0.7"/>
    <ellipse cx="280" cy="820" rx="40" ry="60" fill="url(#bookGlow4)" opacity="0.25"/>
  </g>

  <!-- Table 2 -->
  <g opacity="0.75">
    <rect x="1440" y="850" width="280" height="60" fill="#0f0805" opacity="0.9" rx="4"/>
    <!-- Candelabra -->
    <circle cx="1520" cy="820" r="8" fill="#2a2520" opacity="0.95"/>
    <circle cx="1520" cy="820" r="5" fill="#ffcc77" opacity="0.7"/>
    <ellipse cx="1520" cy="820" rx="40" ry="60" fill="url(#bookGlow4)" opacity="0.25"/>
  </g>

  <!-- Floating glowing books mid-air -->
  <!-- Book 1 - cyan glow -->
  <g opacity="0.9">
    <rect x="550" y="450" width="80" height="50" fill="#1a3a5a" opacity="0.95" rx="3"/>
    <ellipse cx="590" cy="475" rx="50" ry="70" fill="url(#bookGlow1)" opacity="0.6" filter="url(#bookBloom)"/>
  </g>

  <!-- Book 2 - teal glow -->
  <g opacity="0.88">
    <rect x="1290" y="380" width="75" height="55" fill="#1a4a5a" opacity="0.93" rx="3"/>
    <ellipse cx="1328" cy="410" rx="48" ry="68" fill="url(#bookGlow2)" opacity="0.55" filter="url(#bookBloom)"/>
  </g>

  <!-- Book 3 - purple glow -->
  <g opacity="0.85">
    <rect x="750" y="520" width="70" height="48" fill="#3a2a5a" opacity="0.92" rx="3"/>
    <ellipse cx="785" cy="544" rx="45" ry="65" fill="url(#bookGlow3)" opacity="0.5" filter="url(#bookBloom)"/>
  </g>

  <!-- Book 4 - amber glow -->
  <g opacity="0.87">
    <rect x="1100" y="600" width="85" height="52" fill="#4a3a1a" opacity="0.94" rx="3"/>
    <ellipse cx="1142" cy="626" rx="52" ry="70" fill="url(#bookGlow4)" opacity="0.53" filter="url(#bookBloom)"/>
  </g>

  <!-- Spiral staircase silhouette on left -->
  <g opacity="0.7">
    <!-- Staircase opening -->
    <circle cx="420" cy="600" r="120" fill="#0a0508" opacity="0.95" stroke="#1a0f08" stroke-width="4"/>

    <!-- Spiral suggestion -->
    <path d="M 420 480 Q 500 500 520 580 Q 500 660 420 680 Q 340 660 320 580 Q 340 500 420 480" fill="none" stroke="#1a0f08" stroke-width="3" opacity="0.6"/>

    <!-- Stair treads -->
    <line x1="350" y1="540" x2="490" y2="540" stroke="#2a1a1a" stroke-width="3" opacity="0.5"/>
    <line x1="330" y1="600" x2="510" y2="600" stroke="#2a1a1a" stroke-width="3" opacity="0.5"/>
    <line x1="350" y1="660" x2="490" y2="660" stroke="#2a1a1a" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Deep Persian rug on floor -->
  <ellipse cx="960" cy="920" rx="600" ry="140" fill="#5a1a2a" opacity="0.7"/>

  <!-- Rug pattern hints -->
  <circle cx="650" cy="920" r="30" fill="#4a1a2a" opacity="0.4"/>
  <circle cx="1270" cy="920" r="30" fill="#4a1a2a" opacity="0.4"/>
  <circle cx="960" cy="850" r="25" fill="#4a1a2a" opacity="0.35"/>
  <circle cx="960" cy="1000" r="25" fill="#4a1a2a" opacity="0.35"/>
</svg>
