<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="ceilingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#050108;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a0510;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f25;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="windowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b1a4d;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#c41e3a;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8b1a4d;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="windowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cc7722;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ffd966;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#cc7722;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="windowGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#551a6b;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#8b3a99;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#551a6b;stop-opacity:0.8" />
    </linearGradient>
    <radialGradient id="chandGlow" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#ffd966;stop-opacity:0.9" />
      <stop offset="40%" style="stop-color:#cc8811;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#1a0f25;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:0.95" />
      <stop offset="30%" style="stop-color:#4dd0e1;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#0d3b47;stop-opacity:0" />
    </radialGradient>
    <filter id="glow3">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
    </filter>
  </defs>

  <!-- Vaulted ceiling background - deep black -->
  <rect width="1920" height="1080" fill="url(#ceilingGrad)"/>

  <!-- Ceiling vault arches (dark silhouettes) -->
  <path d="M 0 200 Q 480 80 960 200 T 1920 200" stroke="#030106" stroke-width="40" fill="none" opacity="0.8"/>
  <path d="M 0 300 Q 480 150 960 300 T 1920 300" stroke="#0a0510" stroke-width="35" fill="none" opacity="0.7"/>

  <!-- Star field scattered across ceiling -->
  <circle cx="150" cy="100" r="1.5" fill="#e8dcc8" opacity="0.8"/>
  <circle cx="380" cy="90" r="1" fill="#e8dcc8" opacity="0.6"/>
  <circle cx="520" cy="110" r="1.2" fill="#e8dcc8" opacity="0.7"/>
  <circle cx="720" cy="80" r="1" fill="#e8dcc8" opacity="0.6"/>
  <circle cx="890" cy="130" r="1.5" fill="#e8dcc8" opacity="0.8"/>
  <circle cx="1150" cy="95" r="1" fill="#e8dcc8" opacity="0.6"/>
  <circle cx="1380" cy="125" r="1.2" fill="#e8dcc8" opacity="0.7"/>
  <circle cx="1680" cy="85" r="1" fill="#e8dcc8" opacity="0.6"/>
  <circle cx="1850" cy="115" r="1.5" fill="#e8dcc8" opacity="0.8"/>

  <!-- More scattered stars -->
  <circle cx="280" cy="140" r="1" fill="#d0c8b8" opacity="0.5"/>
  <circle cx="620" cy="160" r="1.2" fill="#d0c8b8" opacity="0.6"/>
  <circle cx="950" cy="150" r="1" fill="#d0c8b8" opacity="0.5"/>
  <circle cx="1320" cy="170" r="1.2" fill="#d0c8b8" opacity="0.6"/>
  <circle cx="1780" cy="145" r="1" fill="#d0c8b8" opacity="0.5"/>

  <!-- Even more scattered stars - smaller -->
  <circle cx="420" cy="50" r="0.8" fill="#b8b0a0" opacity="0.4"/>
  <circle cx="780" cy="60" r="0.8" fill="#b8b0a0" opacity="0.4"/>
  <circle cx="1100" cy="45" r="0.8" fill="#b8b0a0" opacity="0.4"/>
  <circle cx="1500" cy="55" r="0.8" fill="#b8b0a0" opacity="0.4"/>

  <!-- Dark stone walls sides -->
  <rect x="0" y="300" width="80" height="780" fill="#1a1520" opacity="0.9"/>
  <rect x="1840" y="300" width="80" height="780" fill="#1a1520" opacity="0.9"/>

  <!-- Stained glass windows left side -->
  <!-- Window 1 - Crimson -->
  <rect x="100" y="350" width="180" height="220" fill="url(#windowGrad1)" opacity="0.9" rx="15"/>
  <polygon points="190,350 190,380 155,415 225,415 190,380" fill="#4d0f24" opacity="0.7"/>

  <!-- Window 2 - Gold -->
  <rect x="100" y="650" width="180" height="220" fill="url(#windowGrad2)" opacity="0.9" rx="15"/>
  <circle cx="190" cy="760" r="40" fill="#8b4513" opacity="0.6"/>

  <!-- Stained glass windows right side -->
  <!-- Window 1 - Violet -->
  <rect x="1640" y="350" width="180" height="220" fill="url(#windowGrad3)" opacity="0.9" rx="15"/>
  <polygon points="1730,350 1730,380 1695,415 1765,415 1730,380" fill="#330055" opacity="0.7"/>

  <!-- Window 2 - Gold -->
  <rect x="1640" y="650" width="180" height="220" fill="url(#windowGrad2)" opacity="0.9" rx="15"/>
  <circle cx="1730" cy="760" r="40" fill="#8b4513" opacity="0.6"/>

  <!-- Window glow halos -->
  <ellipse cx="190" cy="460" rx="110" ry="140" fill="url(#windowGrad1)" opacity="0.25" filter="url(#glow3)"/>
  <ellipse cx="190" cy="760" rx="110" ry="140" fill="url(#windowGrad2)" opacity="0.25" filter="url(#glow3)"/>
  <ellipse cx="1730" cy="460" rx="110" ry="140" fill="url(#windowGrad3)" opacity="0.25" filter="url(#glow3)"/>
  <ellipse cx="1730" cy="760" rx="110" ry="140" fill="url(#windowGrad2)" opacity="0.25" filter="url(#glow3)"/>

  <!-- Long dining tables silhouettes -->
  <g opacity="0.7">
    <!-- Table 1 left -->
    <rect x="150" y="850" width="400" height="60" fill="#0f0613" opacity="0.9" rx="8"/>
    <!-- Table 2 center-left -->
    <rect x="650" y="850" width="400" height="60" fill="#0f0613" opacity="0.9" rx="8"/>
    <!-- Table 3 center-right -->
    <rect x="1150" y="850" width="400" height="60" fill="#0f0613" opacity="0.9" rx="8"/>
  </g>

  <!-- Candelabras on tables - small warm glows -->
  <g opacity="0.8">
    <circle cx="220" cy="820" r="8" fill="#2a2520" opacity="0.9"/>
    <circle cx="220" cy="820" r="5" fill="#ffd966" opacity="0.8"/>
    <ellipse cx="220" cy="820" rx="25" ry="40" fill="url(#chandGlow)" opacity="0.35"/>
  </g>
  <g opacity="0.8">
    <circle cx="380" cy="820" r="8" fill="#2a2520" opacity="0.9"/>
    <circle cx="380" cy="820" r="5" fill="#ffd966" opacity="0.8"/>
    <ellipse cx="380" cy="820" rx="25" ry="40" fill="url(#chandGlow)" opacity="0.35"/>
  </g>
  <g opacity="0.8">
    <circle cx="720" cy="820" r="8" fill="#2a2520" opacity="0.9"/>
    <circle cx="720" cy="820" r="5" fill="#ffd966" opacity="0.8"/>
    <ellipse cx="720" cy="820" rx="25" ry="40" fill="url(#chandGlow)" opacity="0.35"/>
  </g>
  <g opacity="0.8">
    <circle cx="880" cy="820" r="8" fill="#2a2520" opacity="0.9"/>
    <circle cx="880" cy="820" r="5" fill="#ffd966" opacity="0.8"/>
    <ellipse cx="880" cy="820" rx="25" ry="40" fill="url(#chandGlow)" opacity="0.35"/>
  </g>
  <g opacity="0.8">
    <circle cx="1220" cy="820" r="8" fill="#2a2520" opacity="0.9"/>
    <circle cx="1220" cy="820" r="5" fill="#ffd966" opacity="0.8"/>
    <ellipse cx="1220" cy="820" rx="25" ry="40" fill="url(#chandGlow)" opacity="0.35"/>
  </g>
  <g opacity="0.8">
    <circle cx="1380" cy="820" r="8" fill="#2a2520" opacity="0.9"/>
    <circle cx="1380" cy="820" r="5" fill="#ffd966" opacity="0.8"/>
    <ellipse cx="1380" cy="820" rx="25" ry="40" fill="url(#chandGlow)" opacity="0.35"/>
  </g>

  <!-- Massive chandeliers (simplified, silhouettes hanging from ceiling) -->
  <!-- Left chandelier -->
  <g opacity="0.75">
    <line x1="480" y1="150" x2="480" y2="400" stroke="#2a2520" stroke-width="4" opacity="0.7"/>
    <circle cx="480" cy="410" r="50" fill="#1a1520" opacity="0.9"/>
    <circle cx="450" cy="410" r="12" fill="#2a2520" opacity="0.8"/>
    <circle cx="510" cy="410" r="12" fill="#2a2520" opacity="0.8"/>
    <circle cx="480" cy="440" r="12" fill="#2a2520" opacity="0.8"/>
    <ellipse cx="480" cy="410" rx="60" ry="70" fill="url(#chandGlow)" opacity="0.4"/>
  </g>

  <!-- Right chandelier -->
  <g opacity="0.75">
    <line x1="1440" y1="150" x2="1440" y2="400" stroke="#2a2520" stroke-width="4" opacity="0.7"/>
    <circle cx="1440" cy="410" r="50" fill="#1a1520" opacity="0.9"/>
    <circle cx="1410" cy="410" r="12" fill="#2a2520" opacity="0.8"/>
    <circle cx="1470" cy="410" r="12" fill="#2a2520" opacity="0.8"/>
    <circle cx="1440" cy="440" r="12" fill="#2a2520" opacity="0.8"/>
    <ellipse cx="1440" cy="410" rx="60" ry="70" fill="url(#chandGlow)" opacity="0.4"/>
  </g>

  <!-- Center chandelier -->
  <g opacity="0.75">
    <line x1="960" y1="120" x2="960" y2="350" stroke="#2a2520" stroke-width="5" opacity="0.7"/>
    <circle cx="960" cy="365" r="60" fill="#1a1520" opacity="0.9"/>
    <circle cx="920" cy="365" r="14" fill="#2a2520" opacity="0.8"/>
    <circle cx="1000" cy="365" r="14" fill="#2a2520" opacity="0.8"/>
    <circle cx="960" cy="405" r="14" fill="#2a2520" opacity="0.8"/>
    <circle cx="945" cy="370" r="10" fill="#2a2520" opacity="0.8"/>
    <circle cx="975" cy="370" r="10" fill="#2a2520" opacity="0.8"/>
    <ellipse cx="960" cy="365" rx="75" ry="90" fill="url(#chandGlow)" opacity="0.45"/>
  </g>

  <!-- Floor - dark checkered stone -->
  <rect x="0" y="1000" width="1920" height="80" fill="#1a1520" opacity="0.8"/>
  <line x1="0" y1="1020" x2="1920" y2="1020" stroke="#2a2520" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="1040" x2="1920" y2="1040" stroke="#2a2520" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="1060" x2="1920" y2="1060" stroke="#2a2520" stroke-width="2" opacity="0.4"/>

  <!-- Floor reflections of candlelight -->
  <circle cx="220" cy="960" r="30" fill="#ffd966" opacity="0.15"/>
  <circle cx="380" cy="960" r="30" fill="#ffd966" opacity="0.15"/>
  <circle cx="720" cy="960" r="30" fill="#ffd966" opacity="0.15"/>
  <circle cx="880" cy="960" r="30" fill="#ffd966" opacity="0.15"/>
  <circle cx="1220" cy="960" r="30" fill="#ffd966" opacity="0.15"/>
  <circle cx="1380" cy="960" r="30" fill="#ffd966" opacity="0.15"/>

  <!-- Central raised dais with sorting orb -->
  <g opacity="0.85">
    <!-- Dais platform -->
    <rect x="840" y="650" width="240" height="30" fill="#2a2520" opacity="0.9" rx="4"/>
    <rect x="860" y="680" width="200" height="120" fill="#1a1520" opacity="0.85" rx="2"/>

    <!-- Pedestal -->
    <rect x="910" y="780" width="100" height="40" fill="#0f0613" opacity="0.9" rx="2"/>
  </g>

  <!-- Sorting orb - glowing blue-white sphere -->
  <circle cx="960" cy="630" r="55" fill="url(#orbGlow)" opacity="0.95"/>
  <circle cx="960" cy="630" r="50" fill="#c8e6f5" opacity="0.85"/>
  <circle cx="950" cy="610" r="15" fill="#ffffff" opacity="0.7"/>

  <!-- Orb light reflection on dais -->
  <ellipse cx="960" cy="670" rx="120" ry="60" fill="#4dd0e1" opacity="0.25"/>
</svg>
